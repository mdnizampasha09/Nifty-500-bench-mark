<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty 500 Relative Rotation Graph</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.1/plotly.min.js"></script>
</head>
<body class="theme-light">
    <div class="container">
        <header>
            <div class="header-main">
                <h1>📈 NIFTY 500 Relative Rotation Graph (RRG)</h1>
                <p>Tracking Sector Rotation & Momentum Relative to Benchmark</p>
                <div id="last-updated" class="timestamp">Fetching data...</div>
            </div>
            
            <div class="controls-bar">
                <div class="control-group">
                    <label>Timeframe:</label>
                    <div class="btn-group">
                        <button class="toggle-btn active" data-timeframe="daily">Daily</button>
                        <button class="toggle-btn" data-timeframe="weekly">Weekly</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Tail Length:</label>
                    <select id="tail-select">
                        <option value="3">3 Periods</option>
                        <option value="5" selected>5 Periods</option>
                        <option value="8">8 Periods</option>
                        <option value="12">12 Periods</option>
                    </select>
                </div>
                <!-- 12 Background Color Themes -->
                <div class="control-group">
                    <label>Background:</label>
                    <select id="bg-theme-select">
                        <option value="midnight">1. Midnight Navy</option>
                        <option value="deepblack">2. OLED Pure Black</option>
                        <option value="charcoal">3. Charcoal Slate</option>
                        <option value="cyberpunk">4. Cyberpunk Indigo</option>
                        <option value="forest">5. Deep Forest Green</option>
                        <option value="dracula">6. Dracula Purple</option>
                        <option value="nord">7. Nord Arctic Blue</option>
                        <option value="espresso">8. Dark Espresso</option>
                        <option value="burgundy">9. Royal Burgundy</option>
                        <option value="graphite">10. Steel Graphite</option>
                        <option value="solarized">11. Solarized Dark</option>
                        <option value="light">12. Classic Light</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- 4-Quadrant Cards with Checkbox Controls -->
        <div class="quadrant-grid">
            <div class="quadrant-card improving">
                <div class="quadrant-header">
                    <label class="quadrant-title-group">
                        <input type="checkbox" id="master-improving" checked class="quadrant-master-cb">
                        <span class="title">Improving</span>
                    </label>
                    <span id="badge-improving" class="count-badge">0</span>
                </div>
                <div class="quadrant-sub">Lagging RS, Strong Momentum</div>
                <div id="list-improving" class="sector-checkbox-list"></div>
            </div>

            <div class="quadrant-card leading">
                <div class="quadrant-header">
                    <label class="quadrant-title-group">
                        <input type="checkbox" id="master-leading" checked class="quadrant-master-cb">
                        <span class="title">Leading</span>
                    </label>
                    <span id="badge-leading" class="count-badge">0</span>
                </div>
                <div class="quadrant-sub">High RS, Strong Momentum</div>
                <div id="list-leading" class="sector-checkbox-list"></div>
            </div>

            <div class="quadrant-card weakening">
                <div class="quadrant-header">
                    <label class="quadrant-title-group">
                        <input type="checkbox" id="master-weakening" checked class="quadrant-master-cb">
                        <span class="title">Weakening</span>
                    </label>
                    <span id="badge-weakening" class="count-badge">0</span>
                </div>
                <div class="quadrant-sub">High RS, Slowing Momentum</div>
                <div id="list-weakening" class="sector-checkbox-list"></div>
            </div>

            <div class="quadrant-card lagging">
                <div class="quadrant-header">
                    <label class="quadrant-title-group">
                        <input type="checkbox" id="master-lagging" checked class="quadrant-master-cb">
                        <span class="title">Lagging</span>
                    </label>
                    <span id="badge-lagging" class="count-badge">0</span>
                </div>
                <div class="quadrant-sub">Low RS, Slowing Momentum</div>
                <div id="list-lagging" class="sector-checkbox-list"></div>
            </div>
        </div>

        <!-- RRG Chart Area -->
        <div class="card chart-card">
            <div id="rrgPlotly"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
