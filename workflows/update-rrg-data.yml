name: Update RRG Data

on:
  # Run daily at 9 AM UTC (2:30 PM IST)
  schedule:
    - cron: '0 9 * * 1-5'  # Monday-Friday only
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy
      
      - name: Run updater script
        run: python updater.py
      
      - name: Commit and push if data changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if data.json has changed
          if git diff --quiet data.json; then
            echo "✅ No changes to data.json"
          else
            echo "📝 Committing updated data.json..."
            git add data.json
            git commit -m "chore: auto-update RRG data - $(date +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
